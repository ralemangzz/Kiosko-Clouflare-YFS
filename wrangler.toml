name = "portal-linea"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Archivos estáticos (public/index.html, styles.css, Images/) — Cloudflare
# los sirve directo sin pasar por el Worker cuando la ruta coincide con un
# archivo real; src/worker.js solo corre para /api/*.
[assets]
directory = "public"
binding = "ASSETS"

# Namespace de KV donde vive todo el estado del portal (equivalente a
# data/links.json y data/admin.json de la versión para servidor propio).
# Namespace "portal-linea-kv" creado en el dashboard de Cloudflare.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "0ce1549a6bb34a5fa878548b2fab002f"
